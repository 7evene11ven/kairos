[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# The factory embeds the pool's full creation code, so its runtime size is pool-initcode plus
# factory logic. At 1e6 runs that lands ~1KB over EIP-170 and cannot be deployed. 800 leaves ~4KB
# of headroom and costs under 2% on a swap — the same trade-off Uniswap V3 settled on.
optimizer_runs = 800
bytecode_hash = "none"
cbor_metadata = false
ffi = false
gas_reports = ["KairosPool", "KairosRouter", "KairosFactory"]
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200_000

[profile.default.invariant]
runs = 96
depth = 96
fail_on_revert = false
shrink_run_limit = 2000

# Heavier settings for CI / release verification.
[profile.deep.fuzz]
runs = 20_000

[profile.deep.invariant]
runs = 512
depth = 256

# Fast local loop.
[profile.lite]
optimizer = false

[profile.lite.fuzz]
runs = 64

[profile.lite.invariant]
runs = 16
depth = 32

# Lint production code strictly; tests deliberately use narrow casts and raw timestamps.
[lint]
ignore = ["test/**", "script/**"]

[fmt]
line_length = 118
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
sort_imports = true
